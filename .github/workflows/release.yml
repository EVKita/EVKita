name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Tipe kenaikan versi"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      notes:
        description: "Catatan rilis tambahan (opsional)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 22.18+ menjalankan TypeScript langsung tanpa langkah kompilasi,
          # dan `module.registerHooks()` yang dipakai tools/ts-resolver.mjs baru
          # ada sejak 22.15. Node 20 tidak bisa menjalankan `npm test`.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tentukan tipe kenaikan versi
        id: meta
        shell: bash
        # Isian workflow dilewatkan lewat `env`, bukan diinterpolasi langsung ke
        # dalam skrip: teks bebas yang disisipkan ke bash bisa keluar dari
        # konteksnya, dan catatan rilis berisi baris baru bisa memalsukan
        # variabel keluaran karena `echo` biasa tidak punya pembatas.
        env:
          BUMP_INPUT: ${{ github.event.inputs.bump }}
          NOTES_INPUT: ${{ github.event.inputs.notes }}
        run: |
          BUMP="${BUMP_INPUT:-patch}"
          echo "bump=${BUMP}" >> "$GITHUB_OUTPUT"
          {
            echo "notes<<NOTES_EOF"
            echo "${NOTES_INPUT:-}"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Naikkan versi
        id: version
        shell: bash
        run: |
          NEW=$(npm version "${{ steps.meta.outputs.bump }}" --no-git-tag-version)
          NEW="${NEW#v}"
          echo "new=${NEW}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW}" >> "$GITHUB_OUTPUT"

      - name: Uji
        run: npm test

      - name: Build
        run: npm run build

      - name: Package zip
        shell: bash
        run: |
          V="${{ steps.version.outputs.new }}"
          rm -rf release && mkdir -p release
          # node_modules sengaja TIDAK ikut: dependensi runtime sudah dibundel
          # ke dalam dist/ lewat vite.ssr.noExternal di astro.config.mjs.
          # Membawanya berarti mengirim 186 MB / 11.440 berkas toolchain build
          # (TypeScript, Vite, esbuild, sharp) yang tidak dipakai server.
          cp -r dist package.json package-lock.json ecosystem.config.cjs .env.example deploy.sh install.sh release/ 2>/dev/null || true
          chmod +x release/deploy.sh release/install.sh
          mkdir -p release/data
          if [ -f data/content.json ]; then cp data/content.json release/data/content.json; fi
          find release -name ".git" -type d -prune -exec rm -rf {} + 2>/dev/null || true
          cd release
          zip -qr "../evkita.zip" .
          cd ..
          echo "zip=evkita.zip" >> "$GITHUB_OUTPUT"

      - name: Susun changelog
        id: changelog
        shell: bash
        env:
          RELEASE_NOTES: ${{ steps.meta.outputs.notes }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --no-merges --pretty=format:"- %s" HEAD)
          else
            LOG=$(git log --no-merges --pretty=format:"- %s" "$PREV_TAG"..HEAD)
          fi
          if [ -z "$LOG" ]; then LOG="- Rilis v${{ steps.version.outputs.new }}"; fi
          BODY="$LOG"
          if [ -n "${RELEASE_NOTES//[[:space:]]/}" ]; then
            BODY="${BODY}"$'\n\n'"### Catatan"$'\n'"${RELEASE_NOTES}"
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Commit bump & tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: release v${{ steps.version.outputs.new }} [skip ci]" || echo "no changes to commit"
          git tag "v${{ steps.version.outputs.new }}"
          git push origin HEAD:main --follow-tags

      - name: Buat GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.new }}
          name: v${{ steps.version.outputs.new }}
          body: ${{ steps.changelog.outputs.body }}
          files: evkita.zip
