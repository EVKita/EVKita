name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Tipe kenaikan versi"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      notes:
        description: "Catatan rilis tambahan (opsional)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tentukan tipe kenaikan versi
        id: meta
        shell: bash
        run: |
          BUMP="${{ github.event.inputs.bump || 'patch' }}"
          NOTES="${{ github.event.inputs.notes || '' }}"
          echo "bump=${BUMP}" >> "$GITHUB_OUTPUT"
          echo "notes=${NOTES}" >> "$GITHUB_OUTPUT"

      - name: Naikkan versi
        id: version
        shell: bash
        run: |
          NEW=$(npm version "${{ steps.meta.outputs.bump }}" --no-git-tag-version)
          NEW="${NEW#v}"
          echo "new=${NEW}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build

      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Package zip
        shell: bash
        run: |
          V="${{ steps.version.outputs.new }}"
          rm -rf release && mkdir -p release
          cp -r dist node_modules package.json package-lock.json ecosystem.config.cjs .env.example deploy.sh release/ 2>/dev/null || true
          mkdir -p release/data
          if [ -f data/content.json ]; then cp data/content.json release/data/content.json; fi
          find release -name ".git" -type d -prune -exec rm -rf {} + 2>/dev/null || true
          cd release
          zip -qr "../evkita.zip" .
          cd ..
          echo "zip=evkita.zip" >> "$GITHUB_OUTPUT"

      - name: Susun changelog
        id: changelog
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --no-merges --pretty=format:"- %s" HEAD)
          else
            LOG=$(git log --no-merges --pretty=format:"- %s" "$PREV_TAG"..HEAD)
          fi
          if [ -z "$LOG" ]; then LOG="- Rilis v${{ steps.version.outputs.new }}"; fi
          BODY="$LOG"
          if [ -n "${{ steps.meta.outputs.notes }}" ]; then
            BODY="${BODY}"$'\n\n'"### Catatan"$'\n'"${{ steps.meta.outputs.notes }}"
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Commit bump & tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: release v${{ steps.version.outputs.new }} [skip ci]" || echo "no changes to commit"
          git tag "v${{ steps.version.outputs.new }}"
          git push origin HEAD:main --follow-tags

      - name: Buat GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.new }}
          name: v${{ steps.version.outputs.new }}
          body: ${{ steps.changelog.outputs.body }}
          files: evkita.zip
